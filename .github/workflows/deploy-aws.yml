name: Deploy to AWS

# A push to main builds the model service and the symptom extractor, tests
# both inside their images, pushes them to the AWS copy's ECR and redeploys it;
# if the copy then fails its health checks, the previous images go back.
# The whole picture is docs/AWS_CICD.md in MateAlv/diagnostic.ar.
#
# The extractor is built against the latest main of
# MateAlv/spanish-symptoms-recognizer, which deploys it the same way when it
# changes. The model is the release pinned in services/genphenai/model.lock.
#
# Off until the repository secret AWS_DEPLOY_ROLE_ARN exists, so merging this
# file changes nothing by itself. No AWS key is stored here: GitHub signs in
# with OIDC, as a role that only main of this repository can assume.
# DEPLOY_READ_TOKEN reads the two other private repositories (the recognizer's
# code, and the model and HPO embeddings releases of diagnostic.ar-model).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  # Secrets cannot be read in a job's `if`, so a first job says whether
  # AWS_DEPLOY_ROLE_ARN is set; without it the deploy is skipped, not failed.
  configured:
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.check.outputs.yes }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::AWS_DEPLOY_ROLE_ARN is not set; not deploying."; fi

  deploy:
    needs: configured
    if: needs.configured.outputs.yes == 'true'
    runs-on: ubuntu-latest
    # The extractor is ~30 minutes cold; with the cache, far less.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: api

      - uses: actions/checkout@v4
        with:
          repository: MateAlv/spanish-symptoms-recognizer
          ref: main
          token: ${{ secrets.DEPLOY_READ_TOKEN }}
          path: recognizer

      # CPU torch, a 485 MB encoder and the HPO embeddings overrun the
      # runner's default free space.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The account id is not a credential, but it stays out of the logs: it is
      # in the role ARN and in every ECR image name.
      - name: Mask the AWS account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - id: target
        run: |
          set -euo pipefail
          registry=$(aws ssm get-parameter --name /diagnosticar-ci/ECR_REGISTRY --query Parameter.Value --output text)
          api=${GITHUB_SHA::7}
          rec=$(git -C recognizer rev-parse --short=7 HEAD)
          {
            echo "model=$registry/diagnosticar-model:api-$api"
            echo "model_tag=api-$api"
            echo "recognizer=$registry/diagnosticar-hpo-recognizer:api-$api-rec-$rec"
            echo "recognizer_tag=api-$api-rec-$rec"
          } >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Fetch the pinned model
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_READ_TOKEN }}
        run: api/services/genphenai/fetch_model.sh

      - name: Build the model
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/services/genphenai/Dockerfile
          load: true
          provenance: false
          tags: ${{ steps.target.outputs.model }}
          cache-from: type=gha,scope=aws-model
          cache-to: type=gha,scope=aws-model,mode=max

      # Three clinical cases against the rankings production served: a wrong
      # or corrupted model stops here.
      - name: Test the model inside its image
        run: |
          docker run --rm -v "$PWD/api/services/genphenai/tests:/app/tests:ro" ${{ steps.target.outputs.model }} \
            sh -c "pip install -q --user pytest==8.3.2 httpx==0.28.1 && python -m pytest /app/tests -q -p no:cacheprovider"

      # The extractor's HPO embeddings come ready made, from the
      # diagnostic.ar-model release pinned in embeddings.lock.
      - name: Fetch the pinned HPO embeddings
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_READ_TOKEN }}
        run: api/services/api-gateway/fetch_embeddings.sh

      - name: Build the extractor
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/services/api-gateway/Dockerfile.recognizer
          build-contexts: recognizer=./recognizer
          load: true
          provenance: false
          tags: ${{ steps.target.outputs.recognizer }}
          cache-from: type=gha,scope=aws-recognizer
          cache-to: type=gha,scope=aws-recognizer,mode=max

      - name: Test the extractor inside its image
        run: |
          docker run --rm -e PYTHONPATH=/app/services/api-gateway:/app:/opt/recognizer \
            -w /app/services/api-gateway ${{ steps.target.outputs.recognizer }} \
            python -m pytest tests/ -q -p no:cacheprovider
          docker run --rm -w /opt/recognizer ${{ steps.target.outputs.recognizer }} \
            python -m pytest symptoms_recognizer/tests/ -q -p no:cacheprovider

      - name: Push both
        run: |
          docker push --quiet ${{ steps.target.outputs.model }}
          docker push --quiet ${{ steps.target.outputs.recognizer }}

      - name: Deploy
        id: deploy
        run: |
          api/.github/scripts/aws-deploy.sh deploy \
            MODEL_TAG=${{ steps.target.outputs.model_tag }} RECOGNIZER_TAG=${{ steps.target.outputs.recognizer_tag }}

      - name: Health checks
        run: api/.github/scripts/aws-deploy.sh check model recognizer

      # Only once tags have moved: a failed build or test leaves the copy as it was.
      - name: Roll back
        if: failure() && steps.deploy.outcome != 'skipped'
        run: api/.github/scripts/aws-deploy.sh rollback
