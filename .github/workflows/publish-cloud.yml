name: Publish to the cloud copy

# Run by hand (the Actions tab, or `gh workflow run publish-cloud.yml`), not on
# every push: Actions minutes are a monthly quota shared by every repository of
# the account. It builds the model service and the symptom extractor, tests
# both inside their images, and publishes them to GHCR for diagnostic.ar's
# provider-neutral cloud copy (infra/cloud/README.md in MateAlv/diagnostic.ar).
# The machines follow the channel tag `cloud`: each checks it every 5 minutes,
# deploys a new set, and goes back to the previous one by itself if the new
# one fails its checks. Nothing here reaches into a machine or holds a cloud
# credential, so the same run serves a copy on any provider.
#
# The extractor is built against the latest main of
# MateAlv/spanish-symptoms-recognizer, which can publish it the same way. The
# model is the release pinned in services/genphenai/model.lock.
# DEPLOY_READ_TOKEN reads the two other private repositories (the recognizer's
# code, and the model and HPO embeddings releases of diagnostic.ar-model).
#
# The extractor is published from both repositories, so before moving its
# channel this run checks it would not put older code back
# (.github/scripts/cloud-channel-guard.py, the same in both).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write   # to start a new run when each repository has a commit the other's image lacks

# One publish at a time, and never cancelled halfway: the channel moves last.
concurrency:
  group: publish-cloud
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The extractor is ~30 minutes cold; with the cache, far less.
    timeout-minutes: 75
    outputs:
      model_revision: ${{ steps.target.outputs.model_tag }}
      recognizer_revision: ${{ steps.target.outputs.recognizer_tag }}
      recognizer_moved: ${{ steps.guard.outputs.decision == 'move' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: api

      - uses: actions/checkout@v4
        with:
          repository: MateAlv/spanish-symptoms-recognizer
          ref: main
          token: ${{ secrets.DEPLOY_READ_TOKEN }}
          path: recognizer

      # CPU torch, a 485 MB encoder and the HPO embeddings overrun the
      # runner's default free space.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - id: target
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"   # GHCR names are lowercase
          api=${GITHUB_SHA::7}
          rec=$(git -C recognizer rev-parse --short=7 HEAD)
          {
            echo "registry=$registry"
            echo "model=$registry/diagnosticar-cloud-model:api-$api"
            echo "model_tag=api-$api"
            echo "recognizer=$registry/diagnosticar-cloud-hpo-recognizer:api-$api-rec-$rec"
            echo "recognizer_tag=api-$api-rec-$rec"
            echo "recognizer_commit=$(git -C recognizer rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Fetch the pinned model
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_READ_TOKEN }}
        run: api/services/genphenai/fetch_model.sh

      # The machine reads org.opencontainers.image.revision into its
      # /deploy-status.json, which the last job compares against these tags.
      - name: Build the model
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/services/genphenai/Dockerfile
          load: true
          provenance: false
          tags: ${{ steps.target.outputs.model }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.model_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cloud-model
          cache-to: type=gha,scope=cloud-model,mode=max

      # Three clinical cases against the rankings production served: a wrong
      # or corrupted model stops here.
      - name: Test the model inside its image
        run: |
          docker run --rm -v "$PWD/api/services/genphenai/tests:/app/tests:ro" ${{ steps.target.outputs.model }} \
            sh -c "pip install -q --user pytest==8.3.2 httpx==0.28.1 && python -m pytest /app/tests -q -p no:cacheprovider"

      # The extractor's HPO embeddings come ready made, from the
      # diagnostic.ar-model release pinned in embeddings.lock.
      - name: Fetch the pinned HPO embeddings
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_READ_TOKEN }}
        run: api/services/api-gateway/fetch_embeddings.sh

      - name: Build the extractor
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/services/api-gateway/Dockerfile.recognizer
          build-contexts: recognizer=./recognizer
          load: true
          provenance: false
          tags: ${{ steps.target.outputs.recognizer }}
          # Both commits, full: cloud-channel-guard.py compares them with the
          # channel's before moving it.
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.recognizer_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ar.diagnostic.api.commit=${{ github.sha }}
            ar.diagnostic.recognizer.commit=${{ steps.target.outputs.recognizer_commit }}
          cache-from: type=gha,scope=cloud-recognizer
          cache-to: type=gha,scope=cloud-recognizer,mode=max

      - name: Test the extractor inside its image
        run: |
          docker run --rm -e PYTHONPATH=/app/services/api-gateway:/app:/opt/recognizer \
            -w /app/services/api-gateway ${{ steps.target.outputs.recognizer }} \
            python -m pytest tests/ -q -p no:cacheprovider
          docker run --rm -w /opt/recognizer ${{ steps.target.outputs.recognizer }} \
            python -m pytest symptoms_recognizer/tests/ -q -p no:cacheprovider

      - name: Push both
        run: |
          docker push --quiet ${{ steps.target.outputs.model }}
          docker push --quiet ${{ steps.target.outputs.recognizer }}

      # Last, and only once both passed and exist: the machines pull the
      # channel, so it must never point at an image that did not pass.
      # Only this repository publishes the model.
      - name: Move the model's channel
        run: |
          src=${{ steps.target.outputs.model }}
          docker buildx imagetools create -t "${src%:*}:cloud" "$src"
          echo "### Published \`${{ steps.target.outputs.model_tag }}\` to the \`cloud\` channel" >> "$GITHUB_STEP_SUMMARY"

      # The extractor is published from spanish-symptoms-recognizer too, and
      # its run may have finished first with newer code.
      - name: May this run move the extractor's channel?
        id: guard
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.DEPLOY_READ_TOKEN }}
        run: |
          set -euo pipefail
          src=${{ steps.target.outputs.recognizer }}
          decision=$(python3 api/.github/scripts/cloud-channel-guard.py "${src%:*}" \
            "$GITHUB_SHA" "${{ steps.target.outputs.recognizer_commit }}")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "extractor: $decision"

      - name: Move the extractor's channel
        if: steps.guard.outputs.decision == 'move'
        run: |
          src=${{ steps.target.outputs.recognizer }}
          docker buildx imagetools create -t "${src%:*}:cloud" "$src"
          echo "### Published \`${{ steps.target.outputs.recognizer_tag }}\` to the \`cloud\` channel" >> "$GITHUB_STEP_SUMMARY"

      - name: Leave the extractor's channel as it is
        if: steps.guard.outputs.decision == 'skip'
        run: |
          echo "::notice::The extractor's channel already has newer code; it stays."
          echo "### Extractor not published: the channel already has newer code" >> "$GITHUB_STEP_SUMMARY"

      # Each side has a commit the other's image lacks: a new run takes the
      # latest main of both, which has everything.
      - name: Rebuild the extractor with both repositories' latest main
        if: steps.guard.outputs.decision == 'rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-cloud.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "::notice::The extractor's channel and this run each have a commit the other lacks; started a new run with both."
          echo "### Extractor not published: started a new run with both repositories' latest main" >> "$GITHUB_STEP_SUMMARY"

  # Optional: wait for each machine listed in the repository variable
  # CLOUD_URLS (space-separated https://… URLs) to report these images
  # running, so the outcome shows here. Without the variable it is skipped. A
  # machine that rolled back fails this job; the machine itself is already
  # back on the previous images.
  report:
    needs: publish
    if: vars.CLOUD_URLS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the machines
        env:
          URLS: ${{ vars.CLOUD_URLS }}
          MODEL: ${{ needs.publish.outputs.model_revision }}
          RECOGNIZER: ${{ needs.publish.outputs.recognizer_revision }}
          RECOGNIZER_MOVED: ${{ needs.publish.outputs.recognizer_moved }}
        run: |
          set -euo pipefail
          # The extractor only counts if this run moved its channel.
          if [ "$RECOGNIZER_MOVED" = true ]; then
            EXPECT=$(jq -nc --arg m "$MODEL" --arg r "$RECOGNIZER" '{model: $m, recognizer: $r}')
          else
            EXPECT=$(jq -nc --arg m "$MODEL" '{model: $m}')
          fi
          export EXPECT
          for url in $URLS; do
            echo "::group::$url"
            ok=""
            for _ in $(seq 1 90); do
              status=$(curl -sf --max-time 10 "$url/deploy-status.json" || true)
              verdict=$(printf '%s' "$status" | python3 -c '
          import json, os, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              print("wait"); sys.exit()
          imgs, expect = d.get("images", {}), json.loads(os.environ["EXPECT"])
          ours = all(imgs.get(k, {}).get("revision") == v for k, v in expect.items())
          if ours and d.get("result") == "ok":
              print("ok")
          elif d.get("result") in ("rolled_back", "failed") and not ours:
              print("rolled_back:" + d.get("message", ""))
          else:
              print("wait")' )
              case "$verdict" in
                ok) echo "running"; ok=1; break ;;
                rolled_back:*) echo "::error::$url rejected these images: ${verdict#rolled_back:}"; exit 1 ;;
              esac
              sleep 10
            done
            echo "::endgroup::"
            [ -n "$ok" ] || { echo "::error::$url did not report these images within 15 minutes"; exit 1; }
          done
