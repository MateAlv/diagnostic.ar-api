version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.6}
      LOG_TEXT: ${LOG_TEXT:-false}
      # Translator selection: "tower" (recommended) or "nllb"
      TRANSLATOR_TYPE: ${TRANSLATOR_TYPE:-tower}
      # Tower settings (medical-optimized, default)
      TOWER_MODEL_NAME: ${TOWER_MODEL_NAME:-auto}
      TOWER_FALLBACK_MODEL: ${TOWER_FALLBACK_MODEL:-auto}
      TOWER_DEVICE: ${TOWER_DEVICE:-auto}
      TOWER_MAX_LENGTH: ${TOWER_MAX_LENGTH:-1024}
      TOWER_LOAD_IN_4BIT: ${TOWER_LOAD_IN_4BIT:-true}
      TOWER_USE_FLASH_ATTENTION: ${TOWER_USE_FLASH_ATTENTION:-true}
      # NLLB settings (legacy fallback)
      NLLB_MODEL_NAME: ${NLLB_MODEL_NAME:-auto}
      NLLB_DEVICE: ${NLLB_DEVICE:-auto}
      NLLB_MAX_LENGTH: ${NLLB_MAX_LENGTH:-512}
      ENABLE_SPAN_BACKTRANSLATION: ${ENABLE_SPAN_BACKTRANSLATION:-true}
      NORMALIZATION_RULES_PATH: ${NORMALIZATION_RULES_PATH:-/app/data/normalization/es_ar.yml}
      HPO_OBO_PATH: ${HPO_OBO_PATH:-/app/data/hpo/hp.obo}
      HPO_INDEX_PATH: ${HPO_INDEX_PATH:-/app/data/hpo/hpo_index.json}
      HPO_ES_PATH: ${HPO_ES_PATH:-/app/data/hpo/hp-es.json}
      HPO_DOWNLOAD_URL: ${HPO_DOWNLOAD_URL:-https://raw.githubusercontent.com/obophenotype/human-phenotype-ontology/master/hp.obo}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:-postgresql://diagnostic_audit:diagnostic_audit@audit-db:5432/diagnostic_audit}
      STORE_REQUESTS: ${STORE_REQUESTS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - audit-db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  audit-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-diagnostic_audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-diagnostic_audit}
      POSTGRES_DB: ${AUDIT_DB_NAME:-diagnostic_audit}
    volumes:
      - ./data/audit-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  hf_cache:
