version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.6}
      LOG_TEXT: ${LOG_TEXT:-false}
      # Symptom extraction (Ollama LLM)
      ENABLE_SYMPTOM_EXTRACTION: ${ENABLE_SYMPTOM_EXTRACTION:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://llm-ollama:11434}
      SYMPTOM_EXTRACTOR_MODEL: ${SYMPTOM_EXTRACTOR_MODEL:-qwen2.5:7b}
      # Direct Spanish HPO matching
      ENABLE_SPANISH_HPO_MATCHING: ${ENABLE_SPANISH_HPO_MATCHING:-true}
      # Ollama translation settings (for translating unmatched symptoms)
      TRANSLATOR_MODEL: ${TRANSLATOR_MODEL:-qwen2.5:7b}
      NORMALIZATION_RULES_PATH: ${NORMALIZATION_RULES_PATH:-/app/data/normalization/es_ar.yml}
      HPO_OBO_PATH: ${HPO_OBO_PATH:-/app/data/hpo/hp.obo}
      HPO_INDEX_PATH: ${HPO_INDEX_PATH:-/app/data/hpo/hpo_index.json}
      HPO_ES_PATH: ${HPO_ES_PATH:-/app/data/hpo/hp-es.json}
      HPO_DOWNLOAD_URL: ${HPO_DOWNLOAD_URL:-https://github.com/obophenotype/human-phenotype-ontology/releases/download/v2026-01-08/hp.obo}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:-postgresql://diagnostic_audit:diagnostic_audit@audit-db:5432/diagnostic_audit}
      STORE_REQUESTS: ${STORE_REQUESTS:-true}
    ports:
      - "${API_BIND_IP:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - audit-db
    networks:
      - default
      - llm_net
  audit-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-diagnostic_audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-diagnostic_audit}
      POSTGRES_DB: ${AUDIT_DB_NAME:-diagnostic_audit}
    volumes:
      - ./data/audit-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  genphenai:
    build:
      context: .
      dockerfile: services/genphenai/Dockerfile
    environment:
      GENPHENIA_POSTPROCESS_TOP_K: ${GENPHENIA_POSTPROCESS_TOP_K:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${GENPHENAI_BIND_IP:-0.0.0.0}:${GENPHENAI_PORT:-18020}:18020"

  # Follow-up questions (MarBL00126/diagnosticar-question-agent), built from a
  # checkout of that repository; see services/question-agent/README.md.
  # Behind a profile so a plain `up` never needs that checkout:
  #   docker compose --profile question-agent up -d question-agent
  # No published port: in the platform only its backend calls it.
  question-agent:
    build:
      context: .
      dockerfile: services/question-agent/Dockerfile
      additional_contexts:
        agent: ${QUESTION_AGENT_SRC:-../qa-agente-claude}
    profiles: ["question-agent"]
    environment:
      PREGUNTAS_MODEL_SERVICE_URL: http://genphenai:18020
      PREGUNTAS_LLM_PROVIDER: ${PREGUNTAS_LLM_PROVIDER:-template}
      PREGUNTAS_SERVICE_TOKEN: ${QUESTION_AGENT_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN:
      ANTHROPIC_API_KEY:
    healthcheck:
      # The image ships python but no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - genphenai

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

networks:
  llm_net:
    external: true
