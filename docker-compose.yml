version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    runtime: nvidia
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.6}
      LOG_TEXT: ${LOG_TEXT:-false}
      NLLB_MODEL_NAME: ${NLLB_MODEL_NAME:-facebook/nllb-200-1.3B}
      NLLB_DEVICE: ${NLLB_DEVICE:-cuda}
      NLLB_MAX_LENGTH: ${NLLB_MAX_LENGTH:-512}
      ENABLE_SPAN_BACKTRANSLATION: ${ENABLE_SPAN_BACKTRANSLATION:-true}
      NORMALIZATION_RULES_PATH: ${NORMALIZATION_RULES_PATH:-/app/data/normalization/es_ar.yml}
      HPO_OBO_PATH: ${HPO_OBO_PATH:-/app/data/hpo/hp.obo}
      HPO_INDEX_PATH: ${HPO_INDEX_PATH:-/app/data/hpo/hpo_index.json}
      HPO_DOWNLOAD_URL: ${HPO_DOWNLOAD_URL:-https://raw.githubusercontent.com/obophenotype/human-phenotype-ontology/master/hp.obo}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
