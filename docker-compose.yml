version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.6}
      LOG_TEXT: ${LOG_TEXT:-false}
      # Symptom extraction (Ollama LLM)
      ENABLE_SYMPTOM_EXTRACTION: ${ENABLE_SYMPTOM_EXTRACTION:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://llm-ollama:11434}
      SYMPTOM_EXTRACTOR_MODEL: ${SYMPTOM_EXTRACTOR_MODEL:-qwen2.5:7b}
      # Direct Spanish HPO matching
      ENABLE_SPANISH_HPO_MATCHING: ${ENABLE_SPANISH_HPO_MATCHING:-true}
      # NLLB settings (for translating unmatched symptoms)
      NLLB_MODEL_NAME: ${NLLB_MODEL_NAME:-facebook/nllb-200-1.3B}
      NLLB_DEVICE: ${NLLB_DEVICE:-cuda}
      NLLB_MAX_LENGTH: ${NLLB_MAX_LENGTH:-512}
      NORMALIZATION_RULES_PATH: ${NORMALIZATION_RULES_PATH:-/app/data/normalization/es_ar.yml}
      HPO_OBO_PATH: ${HPO_OBO_PATH:-/app/data/hpo/hp.obo}
      HPO_INDEX_PATH: ${HPO_INDEX_PATH:-/app/data/hpo/hpo_index.json}
      HPO_ES_PATH: ${HPO_ES_PATH:-/app/data/hpo/hp-es.json}
      HPO_DOWNLOAD_URL: ${HPO_DOWNLOAD_URL:-https://raw.githubusercontent.com/obophenotype/human-phenotype-ontology/master/hp.obo}
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:-postgresql://diagnostic_audit:diagnostic_audit@audit-db:5432/diagnostic_audit}
      STORE_REQUESTS: ${STORE_REQUESTS:-true}
    ports:
      - "${API_BIND_IP:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - audit-db
    networks:
      - default
      - llm_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  audit-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${AUDIT_DB_USER:-diagnostic_audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-diagnostic_audit}
      POSTGRES_DB: ${AUDIT_DB_NAME:-diagnostic_audit}
    volumes:
      - ./data/audit-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  genphenia-inference:
    image: diagnosticar-api-genphenia-inference
    build:
      context: ../genphenia_inference
      dockerfile: Dockerfile
    environment:
      GENPHENIA_BUNDLE_DIR: ${GENPHENIA_BUNDLE_DIR:-/lucai/diagnostic.ar/genphenia_inference}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ${GENPHENIA_BUNDLE_DIR:-/lucai/diagnostic.ar/genphenia_inference}:${GENPHENIA_BUNDLE_DIR:-/lucai/diagnostic.ar/genphenia_inference}:ro
      - ${GENPHENIA_EMBEDDINGS_DIR:-/home/gcolangelo/GraPhens/data}:${GENPHENIA_EMBEDDINGS_DIR:-/home/gcolangelo/GraPhens/data}:ro
    restart: unless-stopped

  genphenai:
    build:
      context: .
      dockerfile: services/genphenai/Dockerfile
    environment:
      GENPHENIA_DATA_DIR: /app/data
      GENPHENIA_INFERENCE_URL: ${GENPHENIA_INFERENCE_URL:-http://genphenia-inference:8002/predict}
      GENPHENIA_INFERENCE_TIMEOUT_SECONDS: ${GENPHENIA_INFERENCE_TIMEOUT_SECONDS:-30}
      GENPHENIA_POSTPROCESS_TOP_K: ${GENPHENIA_POSTPROCESS_TOP_K:-200}
      GENPHENIA_INFERENCE_MAX_TOP_K: ${GENPHENIA_INFERENCE_MAX_TOP_K:-5229}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${GENPHENAI_BIND_IP:-0.0.0.0}:${GENPHENAI_PORT:-18020}:18020"
    volumes:
      - ../diagnosticar_tools/data:/app/data:ro
    depends_on:
      - genphenia-inference

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  hf_cache:

networks:
  llm_net:
    external: true
