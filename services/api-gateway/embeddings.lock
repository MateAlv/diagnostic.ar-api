# The HPO embeddings the extractor (Dockerfile.recognizer) runs with: a release
# of MateAlv/diagnostic.ar-model, generated there from hpo-embeddings/embeddings.lock
# and published when a change to it is merged. fetch_embeddings.sh downloads and
# checks it; the Dockerfile refuses any other file, and refuses to build when the
# package's manifest disagrees with the pins below or with the recognizer's own
# generator script (so a new encoder means new embeddings, never a mismatch).
#
# To move to another version: publish it in diagnostic.ar-model, then change
# EMB_TAG here, together with the pins below if they changed.
#
# The package's sha256 is the one the release publishes beside it (its .sha256
# asset), so a version can be pinned before it is published and the pull
# requests merged in one go. What the build trusts is still checked: the
# manifest inside must name the encoder and labels pinned below and the
# recognizer's own generator script, and every file must match its sha256 in
# that manifest (check_embeddings.py). Releases of diagnostic.ar-model can only
# be changed by that repository's writers.
EMB_REPO=MateAlv/diagnostic.ar-model
EMB_TAG=hpo-embeddings-v1.0.0
EMB_ASSET=hpo-embeddings-clinlinker-kb-gp.tar.gz

# The encoder the extractor loads at run time to encode what people write. It
# must be the one the embeddings were made with.
CLINLINKER_REPO=ICB-UMA/ClinLinker-KB-GP
CLINLINKER_REVISION=8f914c58a1cbcff43331eb15b101eaa5e5c6920a
# The Spanish HPO labels the embeddings were made from; they ship in the package.
HPO_TRANSLATIONS_COMMIT=69f7f96fba5ae4c1b999028991510088f3480487
