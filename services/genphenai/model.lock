# The GenPhenia bundle /rank-genes serves: a release of MateAlv/diagnostic.ar-model.
# fetch_model.sh downloads and checks it; the Dockerfile refuses anything else.
#
# model-v4.0.0 is the v4 network (genphenia-v4.0): E0's architecture and input
# contract, retrained. Its engine still reports model_version "3.0", the
# architecture; the tarball's sha256 is what names it.
MODEL_REPO=MateAlv/diagnostic.ar-model
MODEL_TAG=model-v4.0.0
MODEL_ASSET=genphenia-v4.0.tar.gz
MODEL_SHA256=62b2c5e8eb4609d1003a81c3632ea82cf2b1173f4ffc646a02ecb66d38d95cc3

# v4-layer over that network's logits: an add-on that can only lower a gene,
# by sex and onset (or age), and a hard rule that moves the genes impossible
# for the patient's sex to the bottom. With no sex, age or onset the output is
# the network's own, bit for bit; excluded terms change nothing. When it is
# pinned the service refuses to start without it, with any file that does not
# match v4.json, or under any other model than the one v4.json names
# (v4layer/). V4_LAYER_ENABLED=false serves the network alone.
V4_LAYER_TAG=model-v4.0.0
V4_LAYER_ASSET=v4-layer.tar.gz
V4_LAYER_SHA256=80d1b159472b5730cfa57f3c636c864c854c820be0c2ee740f67e68c2f399df9
